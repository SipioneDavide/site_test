<script>
  (function () {
    // Theme toggle
    var btn = document.getElementById('theme-toggle');
    if (btn) {
      btn.addEventListener('click', function () {
        var root = document.documentElement;
        var cur = root.dataset.theme ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        var next = cur === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    }

    // "Cite" toggles: show/hide the BibTeX box that follows the button
    document.querySelectorAll('[data-cite-toggle]').forEach(function (b) {
      b.addEventListener('click', function () {
        var box = document.getElementById(b.getAttribute('aria-controls'));
        if (!box) return;
        var open = b.getAttribute('aria-expanded') === 'true';
        b.setAttribute('aria-expanded', String(!open));
        box.hidden = open;
      });
    });

    // Copy BibTeX
    document.querySelectorAll('[data-copy]').forEach(function (b) {
      b.addEventListener('click', function () {
        var pre = document.getElementById(b.getAttribute('data-copy'));
        if (!pre || !navigator.clipboard) return;
        navigator.clipboard.writeText(pre.textContent).then(function () {
          var old = b.textContent;
          b.textContent = 'Copied';
          setTimeout(function () { b.textContent = old; }, 1400);
        });
      });
    });

    // Hero network: vehicles move with SMIL, rings/pulses with CSS.
    // Pause both while off-screen; freeze mid-flow for reduced motion.
    var net = document.querySelector('.hero-network');
    if (net) {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var jams = initJams(net);
      if (reduce && net.pauseAnimations) {
        net.setCurrentTime(2.5);
        net.pauseAnimations();
        jams.simulate(13);          // freeze with one queue formed
      } else {
        var visible = true;
        if ('IntersectionObserver' in window) {
          new IntersectionObserver(function (entries) {
            visible = entries[0].isIntersecting;
            net.classList.toggle('paused', !visible);
            if (net.pauseAnimations) { visible ? net.unpauseAnimations() : net.pauseAnimations(); }
          }).observe(net);
        }
        var last = 0;
        (function frame(ts) {
          var dt = last ? Math.min((ts - last) / 1000, 0.05) : 0;
          last = ts;
          if (visible && dt) jams.step(dt);
          requestAnimationFrame(frame);
        })(0);
      }

      // Gentle pointer parallax (desktop pointers only)
      var vis = net.parentElement;
      if (!reduce && window.matchMedia('(pointer: fine)').matches) {
        var raf = 0;
        window.addEventListener('pointermove', function (e) {
          if (raf) return;
          raf = requestAnimationFrame(function () {
            raf = 0;
            var r = vis.getBoundingClientRect();
            var x = ((e.clientX - (r.left + r.width / 2)) / (window.innerWidth / 2));
            var y = ((e.clientY - (r.top + r.height / 2)) / (window.innerHeight / 2));
            vis.style.setProperty('--mx', Math.max(-1, Math.min(1, x)).toFixed(3));
            vis.style.setProperty('--my', Math.max(-1, Math.min(1, y)).toFixed(3));
          });
        }, { passive: true });
      }
    }

    // Outer ring: each arc is a closed loop of vehicles with simple car
    // following. Now and then ONE random arc gets a red light: the queue
    // grows backwards from the stop line (a congestion wave), then
    // discharges on green. Free flow everywhere between jams.
    function initJams(svg) {
      var NS = 'http://www.w3.org/2000/svg';
      var RED = 7, GREEN = 4, REST = [3, 6];     // seconds: jam, discharge, calm gap (min, max)
      var VMAX = 42, ACC = 45, DEC = 140;       // path units/s, units/s^2
      var GAP = 2.5, SOFT = 12, STOPPED = 6;
      var mixes = [['a', 'a', 'b', 'a'], ['a', 'b', 'a', 'a'], ['b', 'a', 'a', 'a']];
      var sched = { phase: 'rest', t: 2, active: -1, last: -1 };

      var roads = Array.prototype.map.call(svg.querySelectorAll('.hn-jam'), function (g, idx) {
        var id = g.getAttribute('data-jam');
        var path = svg.getElementById('hn-' + id);
        var L = path.getTotalLength();
        var kinds = mixes[idx % mixes.length];
        var phase = Math.random();
        var veh = kinds.map(function (k, i) {
          var len = k === 'b' ? 19 : 11.2;
          var r = document.createElementNS(NS, 'rect');
          r.setAttribute('class', 'hn-veh ' + (k === 'b' ? 'hn-truck' : 'hn-car'));
          r.setAttribute('x', -len / 2); r.setAttribute('y', -3.1);
          r.setAttribute('width', len); r.setAttribute('height', 6.2);
          r.setAttribute('rx', k === 'b' ? 1.8 : 2.4);
          g.appendChild(r);
          return { el: r, len: len, s: L * ((1 - (i + 0.5) / kinds.length + phase) % 1), v: VMAX * 0.9 };
        });
        return {
          path: path, L: L, veh: veh, red: false,
          tint: svg.querySelector('.hn-tint[data-tint="' + id + '"]'),
          light: svg.querySelector('.hn-signal[data-for="' + id + '"]'),
          tintOn: 0
        };
      });

      // rest -> red (random arc, never the previous one) -> green -> rest ...
      function schedule(dt) {
        sched.t -= dt;
        if (sched.t > 0 || !roads.length) return;
        var cur = roads[sched.active];
        if (sched.phase === 'rest') {
          var pick;
          do { pick = Math.floor(Math.random() * roads.length); } while (roads.length > 1 && pick === sched.last);
          sched.active = pick; sched.phase = 'red'; sched.t = RED;
          roads[pick].red = true;
          if (roads[pick].light) roads[pick].light.classList.add('on', 'red');
        } else if (sched.phase === 'red') {
          sched.phase = 'green'; sched.t = GREEN;
          cur.red = false;
          if (cur.light) cur.light.classList.remove('red');
        } else {
          sched.phase = 'rest'; sched.t = REST[0] + Math.random() * (REST[1] - REST[0]);
          sched.last = sched.active;
          if (cur.light) cur.light.classList.remove('on');
        }
      }

      function update(road, dt) {
        var L = road.L, veh = road.veh;
        var red = road.red;
        veh.sort(function (a, b) { return b.s - a.s; });   // front first
        for (var i = 0; i < veh.length; i++) {
          var c = veh[i], gap;
          if (i === 0) {
            var tail = veh[veh.length - 1];
            gap = red ? (L - 3) - (c.s + c.len / 2)
                      : (tail.s + L) - tail.len / 2 - (c.s + c.len / 2);
          } else {
            var lead = veh[i - 1];
            gap = (lead.s - lead.len / 2) - (c.s + c.len / 2);
          }
          var target = VMAX * Math.max(0, Math.min(1, (gap - GAP) / SOFT));
          c.v += Math.max(-DEC * dt, Math.min(ACC * dt, target - c.v));
          if (c.v < 0) c.v = 0;
          c.s += c.v * dt;
          if (i > 0) c.s = Math.min(c.s, veh[i - 1].s - veh[i - 1].len / 2 - c.len / 2 - 0.5);
        }
        veh.forEach(function (c) { if (c.s > L) c.s -= L; });  // leave and re-enter the loop
      }

      function render(road) {
        var veh = road.veh, L = road.L;
        veh.forEach(function (c) {
          var s = Math.max(0, Math.min(L, c.s));
          var p = road.path.getPointAtLength(s);
          var q = road.path.getPointAtLength(Math.min(L, s + 0.8));
          var r = road.path.getPointAtLength(Math.max(0, s - 0.8));
          var ang = Math.atan2(q.y - r.y, q.x - r.x) * 180 / Math.PI;
          c.el.setAttribute('transform', 'translate(' + p.x.toFixed(2) + ' ' + p.y.toFixed(2) + ') rotate(' + ang.toFixed(1) + ')');
        });
        // Queued stretch: the contiguous run of stopped vehicles closest to the end
        var sorted = veh.slice().sort(function (a, b) { return b.s - a.s; });
        var head = -1, tailS = -1;
        for (var i = 0; i < sorted.length; i++) {
          if (sorted[i].v < STOPPED) {
            if (head < 0) head = sorted[i].s + sorted[i].len / 2;
            tailS = sorted[i].s - sorted[i].len / 2;
          } else if (head >= 0) break;
        }
        var want = head >= 0 && head - tailS > 15 ? 0.55 : 0;
        road.tintOn += (want - road.tintOn) * 0.12;
        if (road.tint) {
          if (head >= 0) road.tint.style.strokeDasharray = '0 ' + Math.max(0, tailS).toFixed(1) + ' ' + (head - Math.max(0, tailS)).toFixed(1) + ' ' + (2 * L).toFixed(0);
          road.tint.style.opacity = road.tintOn.toFixed(3);
        }
      }

      function step(dt) {
        schedule(dt);
        roads.forEach(function (r) { update(r, dt); render(r); });
      }
      roads.forEach(render);
      return {
        step: step,
        // Static picture (reduced motion): one arc with a fully formed queue
        simulate: function (seconds) {
          sched.t = 0; schedule(0);                 // start a jam right away
          sched.t = Infinity;                       // ...and keep it red
          for (var t = 0; t < seconds; t += 1 / 30) { roads.forEach(function (r) { update(r, 1 / 30); }); }
          roads.forEach(function (r) { r.tintOn = 0.55; render(r); r.tintOn = r.red ? 0.55 : 0; render(r); });
        }
      };
    }

    // Publication filters
    var filters = document.querySelectorAll('[data-filter]');
    if (filters.length) {
      filters.forEach(function (f) {
        f.addEventListener('click', function () {
          var key = f.getAttribute('data-filter');
          filters.forEach(function (o) { o.setAttribute('aria-pressed', String(o === f)); });
          document.querySelectorAll('.pub-card[data-category]').forEach(function (c) {
            c.hidden = !(key === 'all' || c.getAttribute('data-category') === key);
          });
          document.querySelectorAll('.year-group').forEach(function (g) {
            g.hidden = !g.querySelector('.pub-card:not([hidden])');
          });
        });
      });
    }
  })();
</script>
