<footer class="site-footer">
  <div class="container footer-inner">
    <p class="footer-name">{{ .Site.Params.author }}</p>
    <p class="footer-line">{{ .Site.Params.affiliation }} · {{ .Site.Params.location }}</p>
    <p class="footer-links">
      <a href="mailto:{{ .Site.Params.email }}">{{ .Site.Params.email }}</a>
      <span aria-hidden="true">·</span>
      <a href="{{ .Site.Params.scholar }}" rel="me noopener">Google Scholar</a>
      <span aria-hidden="true">·</span>
      <a href="{{ .Site.Params.orcid }}" rel="me noopener">ORCID</a>
    </p>
    <p class="footer-fine">© {{ now.Year }} {{ .Site.Params.author }}. Built with Hugo.</p>
  </div>
</footer>
