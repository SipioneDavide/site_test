{{/*
  Interactive demo of the noise-robust tolls (IFAC CPHS 2026) on the
  Wheatstone network of the paper. Logic in assets/js/tolls-demo.js.
*/}}
<figure class="td" id="tolls-demo" data-tolls-demo aria-label="Interactive demo: noise-robust tolls on the Wheatstone network">
  <div class="td-top">
    <div class="td-seg" role="group" aria-label="Tolls">
      <button type="button" class="filter-btn" data-mode="marginal" aria-pressed="true">Marginal-cost tolls</button>
      <button type="button" class="filter-btn" data-mode="robust" aria-pressed="false">Noise-robust tolls</button>
    </div>
    <p class="td-kpi">Total travel time <strong data-ttt>–</strong> <span data-gap></span></p>
  </div>
  <svg class="td-net" viewBox="0 0 400 236" role="img" aria-label="Wheatstone network from o to d with three routes; the cars are the drivers, coloured by route"></svg>
  <div class="cg-legend td-legend">
    <span><i class="cg-swatch td-sw-1"></i>route o–a–d <b data-share="0"></b></span>
    <span><i class="cg-swatch td-sw-2"></i>route o–b–d <b data-share="1"></b></span>
    <span><i class="cg-swatch td-sw-3"></i>route o–a–b–d <b data-share="2"></b></span>
  </div>
  <figcaption class="td-cap">
    40 drivers travel from o to d; each road costs twice its flow, the middle one is free.
    Whenever a driver arrives, it picks its next route at random, preferring the cheaper ones.
    With <strong>marginal-cost tolls</strong> alone, this randomness keeps too many drivers on the long middle route.
    The <strong>noise-robust tolls</strong> update a toll on each route from the traffic they observe,
    and the network settles at the system optimum: half of the drivers on each side, none in the middle.
  </figcaption>
</figure>
{{- $js := resources.Get "js/tolls-demo.js" | minify | fingerprint }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
