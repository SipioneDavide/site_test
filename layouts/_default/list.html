{{ define "main" }}
<div class="container">
  {{ partial "page-head.html" . }}

  {{ with .Pages }}
  <ul class="plain-list">
    {{ range .ByDate.Reverse }}
    <li class="plain-item">
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{ if not .Date.IsZero }}<span class="plain-date">{{ .Date.Format "2006" }}</span>{{ end }}
    </li>
    {{ end }}
  </ul>
  {{ end }}
</div>
{{ end }}
